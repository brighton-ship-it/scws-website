# Publish Recent Work cards from Jobber.
#
# How to run: Actions → "Publish Recent Work from Jobber" → Run workflow.
# Required secret (repo Settings → Secrets): JOBBER_MCP_RECENT_WORK_KEY —
#   a read-only key for the Production Jobber MCP (scws-jobs, search_jobs/get_job only).
#   Jobber OAuth is never used or refreshed from Actions: the scws-jobs app is the
#   single writer of the Jobber token store.
# Opens a PR to main. Does not push to main. See recent-work/README.md.
name: Publish Recent Work from Jobber

on:
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days for completed Jobber jobs
        required: false
        default: "75"
      limit:
        description: Max new jobs to add
        required: false
        default: "40"
      pages:
        description: Max Jobber GraphQL pages to walk (default 20; use 80+ for a historical backfill)
        required: false
        default: "20"
      page_size:
        description: Jobs per GraphQL page (default 20)
        required: false
        default: "20"
  schedule:
    # Monday 15:00 UTC ≈ 8am Pacific
    - cron: "0 15 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-recent-work
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no Jobber token needed)
        run: |
          python3 -m unittest scripts/test_recent_work_lib.py scripts/test_photo_audit_lib.py scripts/test_jobber_mcp_mode.py -v
          node ops/photo-audit/server-lib.test.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Check Jobber secrets
        env:
          JOBBER_MCP_RECENT_WORK_KEY: ${{ secrets.JOBBER_MCP_RECENT_WORK_KEY }}
        run: |
          if [ -n "$JOBBER_MCP_RECENT_WORK_KEY" ]; then
            echo "Using read-only Production Jobber MCP (no OAuth refresh from Actions)"
            exit 0
          fi
          echo "Missing JOBBER_MCP_RECENT_WORK_KEY (read-only Production Jobber MCP key)."
          echo "Do not add Jobber OAuth / refresh tokens here. See recent-work/README.md"
          exit 1

      - name: Pull Jobber jobs and write cards
        env:
          JOBBER_MCP_RECENT_WORK_KEY: ${{ secrets.JOBBER_MCP_RECENT_WORK_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '75' }}"
          LIMIT="${{ github.event.inputs.limit || '40' }}"
          PAGES="${{ github.event.inputs.pages || '20' }}"
          PAGE_SIZE="${{ github.event.inputs.page_size || '20' }}"
          python3 scripts/publish-recent-work-from-jobber.py --days "$DAYS" --limit "$LIMIT" --pages "$PAGES" --page-size "$PAGE_SIZE"
          python3 scripts/generate-recent-work-pages.py
          python3 scripts/build_job_map.py --geocode

      - name: Open PR if there are changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recent-work js/recent-work-projects.js images/recent-work sitemap-pages.xml services/ramona/index.html services/anza/index.html
          if git diff --cached --quiet; then
            echo "No new Recent Work cards."
            exit 0
          fi
          STAMP="$(date -u +%Y%m%d)"
          BRANCH="jobber/recent-work-${STAMP}"
          git checkout -B "$BRANCH"
          git commit -m "Add Recent Work cards from completed Jobber jobs"
          git push -u origin "$BRANCH"
          if gh pr list --base main --head "$BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "PR already open for $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Recent Work from Jobber (${STAMP})" \
            --body "$(cat <<'EOF'
          Automated pull of recently completed Jobber jobs and their job photos.

          Review on the PR diff (and after merge on https://scwellservice.com/recent-work/).
          Confirm photos are real Jobber attachments and that cards show city/area only — no last names, street addresses, or prices.

          Do not merge if any card looks private.
          EOF
          )"
