<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Does Palomar's wet climate make iron problems worse?", "acceptedAnswer": {"@type": "Answer", "text": "It can. As one of the wetter parts of San Diego County, Palomar gets strong seasonal recharge, which keeps fractured-granite wells active and gives iron bacteria a steady food supply. Rising and falling water levels can also stir iron and sediment more than in drier areas."}}, {"@type": "Question", "name": "Why is my Palomar well water rusty only sometimes?", "acceptedAnswer": {"@type": "Answer", "text": "Intermittent rust usually comes from stagnation in a part-time cabin or from seasonal shifts in water level. Settled iron and bacterial growth discolor the first use, then often clear. If it never clears, the source is ongoing and worth testing."}}, {"@type": "Question", "name": "Is the granite under Palomar the reason for the iron?", "acceptedAnswer": {"@type": "Answer", "text": "Largely, yes. Wells draw from the fractured granite of the batholith and the decomposed granite above it, both of which contain trace iron and manganese. Groundwater dissolves those metals, which then oxidize into rust at your tap."}}, {"@type": "Question", "name": "My outside tap runs clear but the house water is rusty. Why?", "acceptedAnswer": {"@type": "Answer", "text": "That points to your household plumbing, often old galvanized lines or a rusting water heater, rather than the well. Comparing an outdoor hose bib to indoor taps confirms where the rust enters."}}, {"@type": "Question", "name": "Can a softener handle my iron, or do I need a filter?", "acceptedAnswer": {"@type": "Answer", "text": "A softener removes small amounts of dissolved iron, but heavier iron, manganese, or iron bacteria usually need a dedicated oxidizing iron filter. A water test shows which approach fits your Palomar well."}}, {"@ty
